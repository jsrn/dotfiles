set -g pane-active-border-style fg=pink
set -g pane-border-lines double
set -g pane-border-indicators arrows
set -g pane-border-status top

# keep current directory when splitting
bind * new-pane -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

bind -n M-z resize-pane -Z
bind -n M-d split-window -h -c "#{pane_current_path}"

# note to self:
# prefix, :source-file ~/.tmux.conf to reload config for existing session

set -g mouse on

set -s extended-keys on
set -s extended-keys-format csi-u
set -as terminal-features 'xterm*:extkeys'

# status line: just the window list, coloured to match the active pane border
set -g status-style bg=pink,fg=black
set -g status-left ''
set -g status-right ''
