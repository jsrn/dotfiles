set -g pane-active-border-style fg=pink
set -g pane-border-lines double
set -g pane-border-indicators arrows
set -g pane-border-status top
set -g pane-border-format ' #{pane_index} #{pane_title} '

# keep current directory when splitting
bind * new-pane -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

bind -n M-Left select-pane -L -Z
bind -n M-Right select-pane -R -Z
bind -n M-Up select-pane -U -Z
bind -n M-Down select-pane -D -Z

bind -n M-z resize-pane -Z
bind -n M-d split-window -h -c "#{pane_current_path}"
bind -n M-k send-keys -R \; send-keys C-l \; clear-history

set -g mouse on

set -s extended-keys on
set -s extended-keys-format csi-u
set -as terminal-features 'xterm*:extkeys'

# status line: just the window list, coloured to match the active pane border
# turns lavender with a ZOOMED label while the current window is zoomed
set -g status-style '#{?window_zoomed_flag,bg=#d7b4f3,bg=pink} fg=black'
set -g status-left ''
set -g status-right '#{?window_zoomed_flag,#[bold] ZOOMED ,}'

# note to self:
# prefix, :source-file ~/.tmux.conf to reload config for existing session

